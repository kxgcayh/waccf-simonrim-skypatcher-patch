name = "waccf-simonrim-skypatcher-patch"
display_name = "WACCF Simonrim SkyPatcher Patch"
version = "0.1.0"
description = "Restores Simonrim enchants, charges and names, and Gourmet effects, over WACCF's SkyPatcher configs. No plugin. Personal load-order patch."

# archive path = source path (relative to this folder); dist/ is written by tools/overhaul-patches/restore.py
[files]
"fomod/info.xml" = "dist/flat/fomod/info.xml"
"fomod/ModuleConfig.xml" = "dist/flat/fomod/ModuleConfig.xml"
"Artificer/SKSE/Plugins/SkyPatcher/armor/zz WACCF Simonrim Restore/Restore Artificer.ini" = "dist/flat/Artificer/SKSE/Plugins/SkyPatcher/armor/zz WACCF Simonrim Restore/Restore Artificer.ini"
"Artificer/SKSE/Plugins/SkyPatcher/weapon/zz WACCF Simonrim Restore/Restore Artificer.ini" = "dist/flat/Artificer/SKSE/Plugins/SkyPatcher/weapon/zz WACCF Simonrim Restore/Restore Artificer.ini"
"Gourmet/SKSE/Plugins/SkyPatcher/ingestible/zz WACCF Simonrim Restore/Restore Gourmet.ini" = "dist/flat/Gourmet/SKSE/Plugins/SkyPatcher/ingestible/zz WACCF Simonrim Restore/Restore Gourmet.ini"
"Mysticism/SKSE/Plugins/SkyPatcher/weapon/zz WACCF Simonrim Restore/Restore Mysticism.ini" = "dist/flat/Mysticism/SKSE/Plugins/SkyPatcher/weapon/zz WACCF Simonrim Restore/Restore Mysticism.ini"
"Thaumaturgy/SKSE/Plugins/SkyPatcher/armor/zz WACCF Simonrim Restore/Restore Thaumaturgy.ini" = "dist/flat/Thaumaturgy/SKSE/Plugins/SkyPatcher/armor/zz WACCF Simonrim Restore/Restore Thaumaturgy.ini"
"Thaumaturgy/SKSE/Plugins/SkyPatcher/weapon/zz WACCF Simonrim Restore/Restore Thaumaturgy.ini" = "dist/flat/Thaumaturgy/SKSE/Plugins/SkyPatcher/weapon/zz WACCF Simonrim Restore/Restore Thaumaturgy.ini"
"LICENSE" = "LICENSE"
"THIRD-PARTY-NOTICES.txt" = "THIRD-PARTY-NOTICES.txt"

[nexus]
mod_category = 84  # Nexus mod category: Patches; written as category= in the github .meta

[github]
repo = "kxgcayh/waccf-simonrim-skypatcher-patch"
